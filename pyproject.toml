[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decompcond"
version = "0.1.0"
description = "Configuration-driven, feedback-guided scheduling of molecular inpainting conditions"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6", "pydantic>=2.7,<3", "httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
chem = ["rdkit>=2024.9", "scipy>=1.11"]
test = ["pytest>=8"]
remote = ["paramiko>=3"]

[project.scripts]
decompcond = "decompcond.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
